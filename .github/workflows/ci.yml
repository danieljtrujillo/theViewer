name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Names the toolchain directly, which also stops rustup reading rust-toolchain.toml.
  # The runner image ships a rustup old enough to reject a target tuple in the `channel`
  # field, and that file has to keep one: the workspace needs a gnu-host toolchain, and
  # a gnu host cannot be selected any other way without moving the build output out of
  # target/release/ and breaking the launcher.
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  check:
    name: format, clippy and tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The workspace targets x86_64-pc-windows-gnu, which needs dlltool from MinGW
      # binutils. rustup does not ship it; the runner image carries MSYS2.
      - name: Add MinGW to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin' -Encoding utf8

      - name: Install the toolchain
        run: |
          rustup self update
          rustup toolchain install stable-x86_64-pc-windows-gnu --component rustfmt --component clippy --no-self-update
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Catches broken and ambiguous intra-doc links, which nothing else does.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
